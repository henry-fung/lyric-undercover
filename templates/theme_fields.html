<fieldset><legend>本轮场景主题</legend>
  <label><input type="radio" name="topic_mode" value="random" checked> 完全随机</label>
  <label><input type="radio" name="topic_mode" value="theme"> 预设 / 自定义主题</label>
  <input name="topic" maxlength="80" list="theme-options" placeholder="例如：校园、友情、深夜、旅行，或任何自定义主题">
  <datalist id="theme-options"><option value="校园回忆"><option value="友情"><option value="爱情"><option value="旅行"><option value="深夜"><option value="家庭"><option value="成长"></datalist>
</fieldset>
